<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://script.google.com https://script.googleusercontent.com; connect-src *; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Attendance Check-In</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0ede8;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.2);
    --text: #1a1917; --text-muted: #6b6a67; --text-faint: #9e9d9a;
    --green: #2d7d4f; --green-bg: #e8f5ee; --green-border: #a3d4b5;
    --red: #c0392b; --red-bg: #fdecea; --red-border: #f0b0aa;
    --amber: #8a5a00; --amber-bg: #fdf4e0; --amber-border: #f0d080;
    --blue: #1a5fa8; --blue-bg: #e8f0fb; --blue-border: #a3c0f0;
    --radius: 10px; --radius-lg: 16px;
  }
  body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; }
  .header-top { display: flex; align-items: center; gap: 12px; }
  .logo { width: 30px; height: 30px; background: var(--text); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 2; }
  .header-top h1 { font-size: 15px; font-weight: normal; flex: 1; }
  .header-tag { font-family: monospace; font-size: 11px; background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); padding: 2px 8px; border-radius: 99px; }

  /* Course info banner */
  .course-banner { margin-top: 10px; padding: 10px 12px; background: var(--blue-bg); border: 1px solid var(--blue-border); border-radius: var(--radius); display: none; }
  .course-title { font-size: 14px; color: var(--blue); font-weight: normal; }
  .course-meta { font-family: monospace; font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  main { flex: 1; padding: 16px 20px; max-width: 420px; margin: 0 auto; width: 100%; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; }
  .section-label { font-family: monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--text-faint); text-transform: uppercase; margin-bottom: 10px; }

  /* Name */
  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); font-size: 15px; background: var(--surface); color: var(--text); font-family: 'Georgia', serif; }
  input[type=text]:focus { outline: none; border-color: var(--text); }
  .name-display { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--green-bg); border: 1px solid var(--green-border); border-radius: var(--radius); }
  .name-display .name-text { font-size: 15px; color: var(--green); }
  .name-display .name-edit {
    font-family: monospace; font-size: 12px; color: white;
    cursor: pointer; background: var(--amber); border: none;
    padding: 5px 10px; border-radius: var(--radius); flex-shrink: 0;
  }
  .name-display .name-edit:hover { opacity: 0.85; }

  .result-box { padding: 14px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; display: none; margin-top: 12px; }
  .result-box.show { display: block; }
  .result-box.success { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .result-box.error { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .result-box.warn { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .result-icon { font-size: 20px; display: block; margin-bottom: 6px; }

  /* Complete check-in button — large and prominent */
  .checkin-btn {
    display: none;
    width: 100%;
    padding: 20px;
    margin-bottom: 16px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: var(--radius-lg);
    font-size: 20px;
    font-family: 'Georgia', serif;
    cursor: pointer;
    text-align: center;
    letter-spacing: 0.01em;
    box-shadow: 0 4px 16px rgba(45,125,79,0.35);
    animation: btn-pulse 2s ease-in-out infinite;
    transition: opacity 0.15s, transform 0.1s;
  }
  .checkin-btn:active { opacity: 0.85; transform: scale(0.98); }
  .checkin-btn .btn-sub { display: block; font-size: 13px; opacity: 0.8; margin-top: 4px; font-family: monospace; }
  @keyframes btn-pulse {
    0%,100% { box-shadow: 0 4px 16px rgba(45,125,79,0.35); }
    50% { box-shadow: 0 4px 28px rgba(45,125,79,0.6); }
  }

  /* History — 8-session grid */
  .history-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .hist-cell { border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; text-align: center; }
  .hist-cell.has-data { background: var(--green-bg); border-color: var(--green-border); }
  .hist-cell.today { border-color: var(--blue); background: var(--blue-bg); }
  .hc-day { font-family: monospace; font-size: 10px; color: var(--text-faint); }
  .hc-date { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
  .hc-hours { display: flex; justify-content: center; gap: 2px; margin-top: 4px; flex-wrap: wrap; }
  .hc-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--border); }
  .hc-dot.p { background: var(--green); border-color: var(--green); }

  .note { font-size: 11px; color: var(--text-faint); font-family: monospace; text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="16" y="16" width="5" height="5" rx="0.5"/><rect x="13" y="13" width="2" height="2"/></svg></div>
    <h1>Attendance Check-In</h1>
    <span class="header-tag">Attendee</span>
  </div>
  <div class="course-banner" id="course-banner">
    <div class="course-title" id="course-title-el"></div>
    <div class="course-meta" id="course-meta-el"></div>
  </div>
</header>

<main>
  <div class="section-label">Your name</div>
  <div class="card" id="name-card"></div>
  <div id="auto-result-box" class="result-box" style="margin-bottom:14px;"></div>
  <button id="auto-checkin-btn" class="checkin-btn">
    <span class="btn-main-text">Tap to Check In</span>
    <span class="btn-sub" id="checkin-btn-sub">이름 입력 후 탭하세요</span>
  </button>

  <div class="section-label">My attendance — all sessions</div>
  <div class="card">
    <select id="history-course-select" onchange="onHistoryCourseChange(this.value)" style="display:none;width:100%;padding:8px 10px;margin-bottom:12px;border:1px solid var(--border-strong);border-radius:var(--radius);font-size:13px;font-family:'Georgia',serif;background:var(--surface);color:var(--text);"></select>
    <div id="history-name-note" style="display:none;font-size:11px;font-family:monospace;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);padding:6px 10px;margin-bottom:10px;"></div>
    <div class="history-grid" id="history-grid"></div>
  </div>
</main>

<script>
function ld(k,d){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v));}

const DEFAULT_SESSIONS=Array.from({length:8},(_,i)=>({label:`Day ${i+1}`,date:''}));
const DEFAULT_HOURS=[
  {label:'Hour 1',time:'9:00–10:00 AM'},{label:'Hour 2',time:'10:00–11:00 AM'},
  {label:'Hour 3',time:'11:00–12:00 PM'},{label:'Hour 4',time:'12:00–1:00 PM'},
];

// ── Multi-course support ────────────────────────────────────────────────────
// A single device may scan QR codes from several different instructors' courses
// (each with its own Apps Script backend). Everything specific to one course —
// its day/hour schedule, this student's attendance in it, its script/secret key —
// is kept in att_courses, keyed by that course's script URL (already unique per
// instructor). att_active_course is simply "whichever course was scanned most
// recently" — it drives the check-in flow and the top banner, exactly like the
// single-course version did. The saved name (att_student_name) stays global:
// it's the same person no matter which course they're checking into.
function getCourses(){ return ld('att_courses',{}); }
function getCourse(id){ return getCourses()[id] || {sessions:DEFAULT_SESSIONS,hours:DEFAULT_HOURS,records:{}}; }
function saveCourse(id,patch){
  if(!id)return;
  const all=getCourses();
  all[id]=Object.assign({sessions:DEFAULT_SESSIONS,hours:DEFAULT_HOURS,records:{}}, all[id]||{}, patch);
  sv('att_courses',all);
}
function getActiveCourseId(){ return localStorage.getItem('att_active_course')||''; }
function setActiveCourseId(id){ if(id)localStorage.setItem('att_active_course',id); }

// One-time migration from the old single-course keys, so anyone who already
// has a course checked into on this device doesn't lose that history.
(function migrateLegacyCourseData(){
  if(localStorage.getItem('att_courses')!==null)return; // already migrated (or fresh device)
  const legacyUrl=localStorage.getItem('att_script_url');
  if(!legacyUrl)return;
  const course=ld('att_course_pub',{});
  const legacyName=localStorage.getItem('att_student_name')||'';
  saveCourse(legacyUrl,{
    courseTitle:course.title||'', courseNumber:course.number||'', teacherName:course.teacher||'',
    secretKey:localStorage.getItem('att_secret_key')||'',
    sessions:ld('att_sessions',DEFAULT_SESSIONS),
    hours:ld('att_hours',DEFAULT_HOURS),
    records:ld('att_records',{}),
    lockedName:legacyName,
  });
  setActiveCourseId(legacyUrl);
})();

// Backfill for devices that already have att_courses from an earlier version
// of this page (one that shared a single name across all courses) — lock in
// whichever name that course's own records were actually saved under, so a
// later correction in one course still can't leak into another retroactively.
(function backfillLockedNames(){
  const all=getCourses();
  let changed=false;
  Object.keys(all).forEach(id=>{
    const c=all[id];
    if(c.lockedName)return; // already has its own lock — nothing to do
    const namesInRecords=Object.keys(c.records||{});
    c.lockedName = namesInRecords[0] || localStorage.getItem('att_student_name') || '';
    changed=true;
  });
  if(changed) sv('att_courses',all);
})();

function getSessions(courseId){return getCourse(courseId||getActiveCourseId()).sessions||DEFAULT_SESSIONS;}
function getHours(courseId){return getCourse(courseId||getActiveCourseId()).hours||DEFAULT_HOURS;}
// Before a scan is confirmed (processCheckIn hasn't run yet), the token's own
// sessions/hours must be used directly — the active course in storage still
// points at whichever course was checked into last, which may be a different one.
function sessionsFromToken(token){return Array.isArray(token.sessions)?token.sessions:getSessions(token.scriptUrl);}
function hoursFromToken(token){return Array.isArray(token.hours)?token.hours:getHours(token.scriptUrl);}

// ── Course banner (always reflects the most recently scanned course) ─────────
function renderCourseBanner(){
  const c=getCourse(getActiveCourseId());
  const banner=document.getElementById('course-banner');
  if(c.courseTitle){
    document.getElementById('course-title-el').textContent=c.courseTitle;
    const meta=[c.courseNumber,c.teacherName?'Instructor: '+c.teacherName:''].filter(Boolean).join(' · ');
    document.getElementById('course-meta-el').textContent=meta;
    banner.style.display='block';
    document.title=c.courseTitle+' · Attendance';
  }else{
    // No title for the CURRENT course — hide rather than leave a PREVIOUS
    // course's banner showing, which would misleadingly look like this
    // check-in belongs to the wrong course.
    banner.style.display='none';
  }
}

// ── Name persistence ──────────────────────────────────────────────────────────
// Each course locks in whatever name the student used for its FIRST check-in
// (course.lockedName) — a name correction the instructor makes in one course
// never touches another course's already-locked name. att_student_name is
// only "the last name used on this device" — a convenience default suggested
// when starting a brand-new course for the first time, nothing more; it does
// not drive any already-locked course.
function getLastUsedName(){return localStorage.getItem('att_student_name')||'';}
function setLastUsedName(n){localStorage.setItem('att_student_name',n);}
// Back-compat aliases (same behavior, old names some code below still uses)
function getSavedName(){return getLastUsedName();}
function setSavedName(n){setLastUsedName(n);}

function getLockedName(courseId){return getCourse(courseId).lockedName||'';}
function lockName(courseId,name){saveCourse(courseId,{lockedName:name});}

function getCurrentName(courseId){
  const locked=courseId?getLockedName(courseId):'';
  if(locked)return locked;
  const input=document.getElementById('student-name');
  return input?input.value.trim():'';
}
// Which course's name is showing in the "Your name" card right now — whichever
// course is currently relevant (a token being processed, or the last-active one).
function relevantCourseId(){return (activeToken&&activeToken.scriptUrl)||getActiveCourseId();}

function renderNameCard(courseId){
  courseId=courseId||relevantCourseId();
  const card=document.getElementById('name-card');
  const locked=courseId?getLockedName(courseId):'';
  if(locked){
    card.innerHTML=`
      <div class="name-display">
        <span class="name-text">👤 ${escapeHtml(locked)}</span>
      </div>
      <div style="font-size:11px;font-family:monospace;color:var(--text-faint);margin-top:8px;">
        이름 변경이 필요하면 교사에게 문의하세요.
      </div>`;
  }else{
    const suggestion=getLastUsedName();
    card.innerHTML=`
      <input type="text" id="student-name" placeholder="성명을 입력하세요 (예: 홍길동)" autocomplete="name" value="${escapeHtml(suggestion)}" oninput="onNameInput()" style="font-size:16px;padding:12px;">
      <div style="font-size:11px;font-family:monospace;color:var(--text-faint);margin-top:8px;">
        정확하게 입력해 주세요. 이 과목에서는 한 번 저장되면 이후 변경할 수 없습니다.
      </div>`;
  }
  renderHistory();
}

function onNameInput(){
  const input=document.getElementById('student-name');
  const name=input?.value.trim();
  const btn=document.getElementById('auto-checkin-btn');
  const sub=document.getElementById('checkin-btn-sub');
  if(!btn)return;
  if(!name){btn.style.display='none';return;}
  if(activeToken){
    const SESSIONS=sessionsFromToken(activeToken);const HOURS=hoursFromToken(activeToken);
    const sessLabel=SESSIONS[activeToken.session]?.date?fmtDate(SESSIONS[activeToken.session].date):'Day '+(activeToken.session+1);
    const hourLabel=HOURS[activeToken.hour]?.time||('Hour '+(activeToken.hour+1));
    if(sub)sub.textContent=(activeToken.testMode?'🧪 테스트 모드 · ':'')+sessLabel+' · '+hourLabel;
    btn.querySelector('.btn-main-text').textContent='Tap to Check In';
    btn.style.display='block';
    btn.onclick=()=>{
      const n=document.getElementById('student-name')?.value.trim();
      if(!n){alert('이름을 먼저 입력해 주세요.');return;}
      btn.style.display='none';
      processCheckIn(JSON.stringify(activeToken));
    };
  } else {
    btn.style.display='none';
  }
}
function editName(){
  // NOTE: not wired to any visible button — per policy, only the instructor
  // can correct a name once a course has locked one in. Left here only so it
  // doesn't reference removed functions if something internal ever calls it.
  previousName=getLastUsedName();
  document.getElementById('auto-result-box').className='result-box';
  document.getElementById('auto-checkin-btn').style.display='none';
  const syncEl=document.getElementById('sync-status');
  if(syncEl)syncEl.remove();
  renderNameCard();
  // After renderNameCard creates the input, focus it and show prompt if token exists
  setTimeout(()=>{
    const input=document.getElementById('student-name');
    if(input){
      input.focus();
      // If there's an active token waiting, show instruction
      if(activeToken){
        showAutoResult('warn','✏️','위에 이름을 입력하면 체크인 버튼이 나타납니다.');
      }
    }
  },50);
}

// ── Geolocation util ─────────────────────────────────────────────────────────
function haversine(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

// ── Google Sheets sync ────────────────────────────────────────────────────────
function getScriptURL(courseId){return courseId||getActiveCourseId();}
function getSecretKey(courseId){return getCourse(courseId||getActiveCourseId()).secretKey||'';}
function buildStudentURL(baseUrl,params,secretKey){
  const key=secretKey!==undefined?secretKey:getSecretKey();
  if(key)params.key=key;
  return baseUrl+'?'+new URLSearchParams(params).toString();
}

function showSyncStatus(msg,color){
  let el=document.getElementById('sync-status');
  if(!el){
    el=document.createElement('div');
    el.id='sync-status';
    el.style.cssText='margin-top:10px;padding:8px 12px;border-radius:8px;font-family:monospace;font-size:11px;line-height:1.6;background:var(--surface2);border:1px solid var(--border);';
    document.getElementById('auto-result-box').insertAdjacentElement('afterend',el);
  }
  el.style.color=color||'var(--text-muted)';
  el.textContent=msg;
}

// ── Device fingerprint ────────────────────────────────────────────────────────
// A best-effort, non-invasive signal for spotting suspicious patterns
// (e.g. one physical device checking in under several different names) —
// NOT a reliable unique ID. Combines a few browser/device characteristics
// into a short stable string; recomputed fresh each time it's needed rather
// than cached in localStorage, since it should reflect this browser's actual
// current characteristics, not a value that clearing local data could fake.
function computeDeviceFingerprint(){
  try{
    const parts=[];
    parts.push(navigator.userAgent||'');
    parts.push(navigator.language||'');
    parts.push(screen.width+'x'+screen.height);
    parts.push(String(screen.colorDepth||''));
    parts.push(String(window.devicePixelRatio||''));
    try{ parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone||''); }catch(e){}
    parts.push(String(new Date().getTimezoneOffset()));
    parts.push(String(navigator.hardwareConcurrency||''));
    try{
      const canvas=document.createElement('canvas');
      canvas.width=200;canvas.height=50;
      const ctx=canvas.getContext('2d');
      ctx.textBaseline='top';
      ctx.font='14px Arial';
      ctx.fillStyle='#f60';
      ctx.fillRect(0,0,100,20);
      ctx.fillStyle='#069';
      ctx.fillText('fp-check-🎓',2,15);
      parts.push(canvas.toDataURL());
    }catch(e){ parts.push('canvas-err'); }
    try{
      const glCanvas=document.createElement('canvas');
      const gl=glCanvas.getContext('webgl')||glCanvas.getContext('experimental-webgl');
      if(gl){
        const dbg=gl.getExtension('WEBGL_debug_renderer_info');
        if(dbg){
          parts.push(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)||'');
          parts.push(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)||'');
        }
      }
    }catch(e){ parts.push('webgl-err'); }

    const raw=parts.join('||');
    let hash=0;
    for(let i=0;i<raw.length;i++){ hash=((hash<<5)-hash+raw.charCodeAt(i))|0; }
    return 'fp_'+Math.abs(hash).toString(36);
  }catch(e){
    return 'fp_unknown';
  }
}
let cachedFingerprint=null;
function getDeviceFingerprint(){
  if(!cachedFingerprint) cachedFingerprint=computeDeviceFingerprint();
  return cachedFingerprint;
}

// Any check-in that fails to reach the Sheet after retries is kept here so
// it can be retried automatically next time this page loads — e.g. the
// student reopens it later, or scans the next QR — rather than being lost
// the moment the student closes the tab.
function addToPendingSyncQueue(payload,courseId){
  const q=ld('att_pending_syncs',[]);
  q.push({payload,courseId,ts:Date.now()});
  sv('att_pending_syncs',q);
}
function removeFromPendingSyncQueue(payload,courseId){
  const q=ld('att_pending_syncs',[]);
  const filtered=q.filter(item=>!(item.courseId===courseId&&item.payload.session===payload.session&&item.payload.hour===payload.hour&&item.payload.name===payload.name));
  if(filtered.length!==q.length) sv('att_pending_syncs',filtered);
}
function retryPendingSyncs(){
  const q=ld('att_pending_syncs',[]);
  if(q.length===0)return;
  // Drop anything absurdly old so the queue can't grow forever from ancient failed attempts
  const DAY=24*60*60*1000;
  const fresh=q.filter(item=>Date.now()-item.ts<DAY);
  if(fresh.length!==q.length) sv('att_pending_syncs',fresh);
  fresh.forEach(item=>sendToSheet(item.payload,item.courseId,0));
}

function handleSyncFailure(payload,courseId,attempt){
  // A busy moment on the instructor's Sheet (e.g. right after a rename or
  // several students checking in at once) can make a single attempt time
  // out even though the Sheet itself is fine — retry a couple of times
  // before treating it as a real, longer-lived failure.
  if(attempt<2){
    showSyncStatus('⚠ 동기화가 지연되고 있습니다 — 잠시 후 다시 시도합니다…','var(--amber)');
    setTimeout(()=>sendToSheet(payload,courseId,attempt+1),4000*(attempt+1));
  }else{
    showSyncStatus('❌ 서버 동기화에 실패했습니다 — 기기에는 저장되어 있고, 다음에 이 페이지를 열면 자동으로 다시 시도합니다.','var(--red)');
    addToPendingSyncQueue(payload,courseId);
  }
}

function sendToSheet(payload,courseId,attempt){
  courseId=courseId||getActiveCourseId();
  attempt=attempt||0;
  const url=getScriptURL(courseId);
  if(!url){
    showSyncStatus('⚠ No script URL — check-in saved locally only','var(--amber)');
    return;
  }
  showSyncStatus(attempt>0?`동기화 재시도 중… (${attempt}/2)`:'Syncing to Google Sheets…');

  const cbName='_ci'+Date.now()+Math.random().toString(36).slice(2,6);
  const script=document.createElement('script');

  // The server doesn't respond until it's finished rewriting the whole
  // Summary sheet after this check-in, which can take longer than a quick
  // save alone — especially as a course accumulates more students/sessions.
  // A short client timeout can give up before that legitimately finishes,
  // showing a false "failed" even though the Sheet is actually fine.
  const timer=setTimeout(()=>{
    delete window[cbName];script.remove();
    handleSyncFailure(payload,courseId,attempt);
  },25000);

  window[cbName]=function(data){
    clearTimeout(timer);delete window[cbName];script.remove();
    if(data&&data.status==='ok'){
      showSyncStatus('✓ Synced to Google Sheets ('+data.message+')','var(--green)');
      removeFromPendingSyncQueue(payload,courseId);
      // 시트 저장 완료 후 해당 학생 기록만 다시 조회
      setTimeout(()=>renderHistory(courseId), 500);
    } else {
      handleSyncFailure(payload,courseId,attempt);
    }
  };

  script.onerror=function(){
    clearTimeout(timer);delete window[cbName];script.remove();
    handleSyncFailure(payload,courseId,attempt);
  };

  script.src=buildStudentURL(url,{
    action:       'checkin',
    name:         payload.name         ||'',
    previousName: payload.previousName ||'',
    session:      payload.session,
    hour:         payload.hour,
    sessionDate:  payload.sessionDate  ||'',
    hourLabel:    payload.hourLabel    ||'',
    checkInTime:  payload.checkInTime  ||'',
    dist:         payload.dist!==null&&payload.dist!==undefined?payload.dist:'',
    courseTitle:  payload.courseTitle  ||'',
    courseNumber: payload.courseNumber ||'',
    teacherName:  payload.teacherName  ||'',
    fingerprint:  getDeviceFingerprint(),
    // Rebuilding the whole Summary sheet on every single check-in is the
    // heaviest part of this request — with many students checking in at
    // nearly the same moment, that cost multiplied across all of them is
    // what causes timeouts under real classroom load. Skip it here; the
    // instructor's own page refreshes Summary periodically in the background
    // instead, decoupling it from this time-critical path.
    skipSummary:  'true',
  },getSecretKey(courseId))+'&callback='+cbName;
  document.head.appendChild(script);
  showSyncStatus('출석 정보를 서버로 보내는 중…');
}

// ── Check-in ──────────────────────────────────────────────────────────────────
function showAutoResult(type,icon,msg){const el=document.getElementById('auto-result-box');el.className='result-box show '+type;el.innerHTML=`<span class="result-icon">${icon}</span>${msg}`;}

function processCheckIn(raw){
  let token;
  try{token=JSON.parse(raw);}catch{showAutoResult('error','❌','Invalid check-in link. Please scan the QR code again.');return;}
  if(Date.now()-token.ts>63000){showAutoResult('error','⏰','QR code expired. Ask your teacher to refresh it.');return;}
  if(token.session===undefined||token.hour===undefined){showAutoResult('error','❌','Unrecognised QR code.');return;}
  if(!token.scriptUrl){showAutoResult('error','❌','Unrecognised QR code.');return;}

  const courseId=token.scriptUrl;

  // Test-mode QR codes (instructor's "🧪 Testing mode" toggle) are meant for
  // trying the scan flow before real class — often scanned straight from a
  // phone's camera app, which always opens a normal (non-private) tab, so
  // there's no reliable way to ask a tester to "use private browsing"
  // instead. Handle it here in code: still hit the real server (so
  // connectivity/setup can be verified end-to-end), but never lock a name
  // or cache a record on this device for it — nothing is left behind to
  // conflict with the same slot's real check-in later.
  if(token.testMode){
    processTestCheckIn(token,courseId);
    return;
  }

  let name=getCurrentName(courseId);
  if(!name){showAutoResult('warn','✏️','Please enter your name before scanning.');return;}

  // Save/update this course's bundle FIRST — everything below (rename,
  // duplicate check, recording, sheet sync) reads from it via courseId.
  saveCourse(courseId,{
    courseTitle:token.courseTitle||'', courseNumber:token.courseNumber||'', teacherName:token.teacherName||'',
    secretKey:token.secretKey||'',
    // Day/hour config is configurable per course — sync it from the QR every
    // scan so "My attendance" always matches the instructor's real schedule.
    sessions:Array.isArray(token.sessions)?token.sessions:getCourse(courseId).sessions,
    hours:Array.isArray(token.hours)?token.hours:getCourse(courseId).hours,
  });
  setActiveCourseId(courseId);
  renderCourseBanner();

  // First-ever check-in for THIS course — lock the name in, scoped to this
  // course only. A correction made later in a different course never reaches
  // in and changes this lock; only this course's own instructor can.
  if(!getLockedName(courseId)){
    lockName(courseId,name);
    setLastUsedName(name); // remember as the suggested default for the NEXT brand-new course
  }

  // Apply any pending name correction(s) from THIS course's instructor —
  // scoped strictly to this course's lock and this course's local records.
  // Follows the FULL chain (A→B→C→…) in one pass, not just one hop — a
  // student renamed twice before ever rescanning should still land on the
  // final name in a single scan, with every consumed hop cleared from the
  // instructor's pending list, not just the first one.
  if(token.renames&&typeof token.renames==='object'){
    const currentLocked=getLockedName(courseId);
    if(currentLocked&&token.renames[currentLocked]){
      const consumedOldNames=[];
      let newName=currentLocked;
      let hops=0;
      while(token.renames[newName]&&!consumedOldNames.includes(newName)&&hops<10){
        consumedOldNames.push(newName);
        newName=token.renames[newName];
        hops++;
      }

      const course=getCourse(courseId);
      const recs=course.records||{};
      if(recs[currentLocked]){
        recs[newName]=recs[newName]||{};
        Object.keys(recs[currentLocked]).forEach(si=>{
          recs[newName][si]=recs[newName][si]||{};
          Object.assign(recs[newName][si],recs[currentLocked][si]);
        });
        if(currentLocked!==newName) delete recs[currentLocked];
      }
      saveCourse(courseId,{records:recs,lockedName:newName});
      name=newName; // use new (fully-resolved) name for the rest of check-in
      // Also update the device-wide "last used name" suggestion — otherwise
      // the NEXT brand-new course this student checks into would still be
      // pre-filled with the old, now-corrected name.
      setLastUsedName(newName);
      showAutoResult('warn','✏️',`이름이 "${currentLocked}"에서 "${newName}"으로 수정되었습니다.`);
      renderNameCard(courseId);

      // Delete EVERY hop consumed from the Renames sheet — not just the
      // first — so the instructor's "pending" banner fully clears in one go.
      consumedOldNames.forEach(oldN=>{
        const cbName='_dr'+Date.now()+Math.random().toString(36).slice(2,8);
        const script=document.createElement('script');
        const timer=setTimeout(()=>{delete window[cbName];script.remove();},10000);
        window[cbName]=function(){clearTimeout(timer);delete window[cbName];script.remove();};
        script.src=buildStudentURL(courseId,{action:'delete_rename',oldName:oldN},getSecretKey(courseId))+'&callback='+cbName;
        document.head.appendChild(script);
      });

      // Also notify via BroadcastChannel (same device fallback)
      try{new BroadcastChannel('att_sync').postMessage({type:'rename_applied',oldName:currentLocked,newName});}catch(e){}
      const applied=ld('att_renames_applied',{});
      consumedOldNames.forEach(oldN=>{applied[oldN]=Date.now();});
      sv('att_renames_applied',applied);
    }
  }

  // Note: we deliberately do NOT short-circuit here even if the local cache
  // already has this session/hour recorded. Trusting the local cache alone
  // meant that if the instructor ever cleared the Sheet (e.g. wiping test
  // data before real class), a student who'd already tested that exact
  // slot on this device would silently never re-submit it — their phone
  // believed it was already done, so the Sheet stayed empty forever for
  // that slot. Always confirming with the server costs one extra request
  // for genuine repeat scans, but the server's own check-in logic already
  // updates an existing row in place rather than duplicating it, so this is
  // safe either way.

  if(token.geo&&token.lat!==null&&token.lng!==null){
    showAutoResult('warn','📍','Verifying your location…');
    if(!navigator.geolocation){showAutoResult('error','❌','Location not supported by your browser.');return;}
    navigator.geolocation.getCurrentPosition(pos=>{
      const dist=haversine(pos.coords.latitude,pos.coords.longitude,token.lat,token.lng);
      if(dist>token.radius){showAutoResult('error','📍',`You are ${Math.round(dist)}m from the classroom. Must be within ${token.radius}m.`);}
      else{recordAttendance(name,token.session,token.hour,dist,courseId);}
    },err=>{showAutoResult('error','❌','Location denied: '+err.message);},{enableHighAccuracy:true,timeout:10000});
  }else{
    recordAttendance(name,token.session,token.hour,null,courseId);
  }
}

// ── Test-mode check-in (never persisted on this device) ───────────────────────
function processTestCheckIn(token,courseId){
  const name=getCurrentName(courseId);
  if(!name){showAutoResult('warn','✏️','Please enter your name before scanning.');return;}

  showAutoResult('warn','🧪','테스트 모드 — 서버로 전송 중… (이 기기에는 저장되지 않습니다)');

  const now=new Date();
  const checkInTime=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
  const sessions=sessionsFromToken(token), hours=hoursFromToken(token);
  const payload={
    name,
    session:token.session,
    hour:token.hour,
    sessionDate:sessions[token.session]?.date||'',
    hourLabel:hours[token.hour]?.time||('Hour '+(token.hour+1)),
    checkInTime,
    courseTitle:token.courseTitle||'',
    courseNumber:token.courseNumber||'',
    teacherName:token.teacherName||'',
  };

  const cbName='_tci'+Date.now()+Math.random().toString(36).slice(2,6);
  const script=document.createElement('script');
  const timer=setTimeout(()=>{
    delete window[cbName];script.remove();
    showAutoResult('error','❌','테스트 체크인 응답이 없습니다 (시간 초과). 서버에는 도착했을 수 있습니다.');
  },25000);
  window[cbName]=function(data){
    clearTimeout(timer);delete window[cbName];script.remove();
    if(data&&data.status==='ok'){
      showAutoResult('success','🧪',`테스트 체크인 완료 — Day ${token.session+1}, Hour ${token.hour+1} (이 기록은 이 기기에 저장되지 않았습니다)`);
    }else{
      showAutoResult('error','❌','테스트 체크인 실패: '+(data&&data.message||'알 수 없음'));
    }
  };
  script.onerror=function(){
    clearTimeout(timer);delete window[cbName];script.remove();
    showAutoResult('error','❌','서버에 연결하지 못했습니다.');
  };
  const params={
    action:'checkin', name:payload.name, previousName:'',
    session:payload.session, hour:payload.hour,
    sessionDate:payload.sessionDate, hourLabel:payload.hourLabel,
    checkInTime:payload.checkInTime, dist:'',
    courseTitle:payload.courseTitle, courseNumber:payload.courseNumber, teacherName:payload.teacherName,
    fingerprint:getDeviceFingerprint(), skipSummary:'true',
  };
  if(token.secretKey)params.key=token.secretKey;
  script.src=courseId+'?'+new URLSearchParams(params).toString()+'&callback='+cbName;
  document.head.appendChild(script);
}

function recordAttendance(name,si,hi,dist,courseId){
  courseId=courseId||getActiveCourseId();
  const course=getCourse(courseId);
  const attendance=course.records||{};
  if(!attendance[name])attendance[name]={};
  if(!attendance[name][si])attendance[name][si]={};
  const existing=attendance[name][si][hi];
  // A genuine repeat scan keeps its ORIGINAL recorded time rather than
  // jumping to "now" — this call still reaches the server (see note above),
  // it just doesn't make an already-checked-in moment look like it happened
  // again just now.
  const now=new Date();
  const checkInTime=existing?existing.time:now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
  const checkInDate=existing?existing.date:now.toLocaleDateString();
  const finalDist=dist!==null?Math.round(dist):(existing?existing.dist:null);
  attendance[name][si][hi]={time:checkInTime,date:checkInDate,dist:finalDist};
  saveCourse(courseId,{records:attendance});
  // Notify teacher page
  if(typeof BroadcastChannel!=='undefined'){try{new BroadcastChannel('att_sync').postMessage('att_records');}catch(e){}}
  // Hide check-in button
  const btn=document.getElementById('auto-checkin-btn');
  if(btn)btn.style.display='none';  // Send to Google Sheet
  sendToSheet({
    action:'checkin',
    name,
    previousName: previousName||'',
    session:si,
    hour:hi,
    sessionDate:getSessions(courseId)[si]?.date||'',
    hourLabel:getHours(courseId)[hi]?.time||('Hour '+(hi+1)),
    checkInTime,
    dist:finalDist,
    courseTitle:course.courseTitle||'',
    courseNumber:course.courseNumber||'',
    teacherName:course.teacherName||'',
  },courseId);
  previousName=null; // clear after use
  // Name locking (and the last-used-name suggestion) is already handled in
  // processCheckIn before this point — just refresh the card for this course.
  renderNameCard(courseId);
  const s=getSessions(courseId)[si];
  const geoNote=finalDist!==null?` · ${finalDist}m from classroom`:'';
  const dateNote=s.date?` (${fmtDate(s.date)})`:'';
  const msg=existing
    ? `Already checked in for <strong>Day ${si+1}${dateNote}, Hour ${hi+1}</strong> at ${checkInTime}${geoNote} — re-confirmed with server.`
    : `Checked in for <strong>Day ${si+1}${dateNote}, Hour ${hi+1}</strong> at ${checkInTime}${geoNote}`;
  showAutoResult('success','✅',msg);

  // Show local data immediately (fast)
  renderHistory(courseId);

  // After sheet sync completes (~3s), fetch latest from sheet to reflect any manual entries
  setTimeout(()=>renderHistory(courseId), 3500);
}

// ── History grid ──────────────────────────────────────────────────────────────
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtDate(iso){if(!iso)return '';const[y,m,d]=iso.split('-');return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'});}

let selectedHistoryCourse=null; // which course's history is currently shown (independent of the active/most-recently-scanned course)

function onHistoryCourseChange(courseId){
  selectedHistoryCourse=courseId;
  renderHistory(courseId);
}

function renderCourseSelect(activeId){
  const sel=document.getElementById('history-course-select');
  const courses=getCourses();
  const ids=Object.keys(courses);
  if(ids.length<2){ sel.style.display='none'; return; } // only bother showing a picker once there's something to pick between
  sel.style.display='block';
  sel.innerHTML=ids.map(id=>{
    const c=courses[id];
    const label=[c.courseTitle,c.teacherName].filter(Boolean).join(' · ')||'강좌';
    return `<option value="${escapeHtml(id)}"${id===activeId?' selected':''}>${escapeHtml(label)}</option>`;
  }).join('');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// The name shown in the "Your name" card right now (whichever course is
// currently relevant) — compared against a course being viewed in the
// history dropdown, so we can flag when they don't match.
function getTopDisplayedName(){
  const id=relevantCourseId();
  return id?getLockedName(id):'';
}
function updateNameMismatchNote(courseId){
  const el=document.getElementById('history-name-note');
  if(!el)return;
  const topName=getTopDisplayedName();
  const thisName=courseId?getLockedName(courseId):'';
  if(topName&&thisName&&topName!==thisName){
    el.textContent=`이 과목에서는 "${thisName}"(으)로 기록되고 있습니다.`;
    el.style.display='block';
  }else{
    el.style.display='none';
  }
}

function renderHistory(courseId){
  if(courseId) selectedHistoryCourse=courseId;
  courseId=selectedHistoryCourse||getActiveCourseId();

  const grid=document.getElementById('history-grid');
  const today=todayStr();

  renderCourseSelect(courseId);
  updateNameMismatchNote(courseId);

  const name=courseId?getLockedName(courseId):'';
  if(!name){
    grid.innerHTML='<div style="grid-column:1/-1;font-size:12px;font-family:monospace;color:var(--text-faint);padding:8px 0;">QR 스캔 후 체크인하시면 출석 기록이 표시됩니다.</div>';
    return;
  }

  const SESSIONS=getSessions(courseId);
  const HOURS=getHours(courseId);

  // 항상 로컬 데이터 먼저 표시
  function renderGrid(rec){
    grid.innerHTML=SESSIONS.map((s,si)=>{
      const sr=rec[si]||{};
      const hours=Object.keys(sr).length;
      const isToday=s.date&&s.date===today;
      const hasData=hours>0;
      const dots=Array.from({length:HOURS.length},(_,hi)=>`<div class="hc-dot${sr[hi]?' p':''}" title="${sr[hi]?sr[hi].time:'결석'}"></div>`).join('');
      return `<div class="hist-cell${hasData?' has-data':''}${isToday?' today':''}">
        <div class="hc-day">Day ${si+1}</div>
        <div class="hc-date">${s.date?fmtDate(s.date):'—'}</div>
        <div class="hc-hours">${dots}</div>
      </div>`;
    }).join('');
  }

  // 로컬 데이터 먼저 표시 (조회 중에도 유지)
  const course=getCourse(courseId);
  const localRec=(course.records||{})[name]||{};
  const url=getScriptURL(courseId);
  if(Object.keys(localRec).length>0 || !url){
    renderGrid(localRec);
  }

  // 구글 시트에서 해당 학생 기록만 조회 (빠르고 개인정보 안전)
  if(!url)return;

  const cbName='_hist'+Date.now();
  const script=document.createElement('script');
  const timer=setTimeout(()=>{delete window[cbName];script.remove();},10000);
  window[cbName]=function(data){
    clearTimeout(timer);delete window[cbName];script.remove();
    if(!data||data.status!=='ok')return;
    const sheetRec=data.record||{};
    // 서버가 이 이름이 이미 다른 이름으로 수정되었음을 알려주면(재스캔 없이도),
    // 로컬 잠금 이름과 기록을 조용히 새 이름으로 맞춰준다.
    const resolvedName=(data.resolvedName&&data.resolvedName!==name)?data.resolvedName:null;
    const targetName=resolvedName||name;

    const c=getCourse(courseId);
    const recs=c.records||{};
    const merged=Object.assign({},recs[targetName]||{});
    Object.keys(sheetRec).forEach(si=>{
      if(!merged[si])merged[si]={};
      Object.assign(merged[si],sheetRec[si]);
    });
    recs[targetName]=merged;
    if(resolvedName) delete recs[name]; // fold the stale-named local cache into the resolved name
    const patch={records:recs};
    if(resolvedName) patch.lockedName=resolvedName;
    saveCourse(courseId,patch);
    if(resolvedName){
      updateNameMismatchNote(courseId);
      // Also update the device-wide suggestion — so the next brand-new
      // course this student starts is pre-filled with the corrected name.
      setLastUsedName(resolvedName);
    }

    // 그 사이 사용자가 다른 강좌로 전환했으면 지금 화면을 덮어쓰지 않음
    if(selectedHistoryCourse===courseId||(!selectedHistoryCourse&&courseId===getActiveCourseId())) renderGrid(merged);
  };
  script.src=buildStudentURL(url,{action:'get_student_records',name},getSecretKey(courseId))+'&callback='+cbName;
  document.head.appendChild(script);
}

// ── Rename in sheet ───────────────────────────────────────────────────────────
function renameInSheet(oldName, newName, courseId){
  courseId=courseId||getActiveCourseId();
  const url=getScriptURL(courseId);
  if(!url||!oldName||!newName||oldName===newName)return;
  const cbName='_rn'+Date.now();
  const script=document.createElement('script');
  const timer=setTimeout(()=>{delete window[cbName];script.remove();},15000);
  window[cbName]=function(){clearTimeout(timer);delete window[cbName];script.remove();renderHistory();};
  script.src=buildStudentURL(url,{action:'rename',oldName,newName},getSecretKey(courseId))+'&callback='+cbName;
  document.head.appendChild(script);
}

// ── Active token (kept in memory so onNameInput/renderNameCard can re-use it) ─
let activeToken = null;
let previousName = null; // tracks name before correction

// ── Init ──────────────────────────────────────────────────────────────────────
// Parse a scanned QR token (if any) BEFORE rendering the name card / banner —
// the name card needs to know which course is relevant right now so it shows
// that course's own locked name (or a fresh input if this is a new course),
// not whichever course happened to be active before this scan.
(function initFromURL(){
  const params=new URLSearchParams(window.location.search);
  const t=params.get('t');
  try{window.history.replaceState({},'',window.location.pathname);}catch(e){} // clean URL either way

  if(t){
    try{ activeToken=JSON.parse(decodeURIComponent(escape(atob(t)))); }
    catch(e){
      renderCourseBanner(); renderNameCard();
      showAutoResult('error','❌','Invalid check-in link. Please scan again.');
      return;
    }
  }

  renderCourseBanner();
  renderNameCard();
  if(activeToken) showCheckinButton(activeToken);

  // Retry anything that failed to sync last time this page was open —
  // best-effort, runs quietly in the background.
  retryPendingSyncs();
})();

// When starting a brand-new (never checked-into) course, silently check
// whether the name suggested here — carried over from whichever course was
// used last — has since been corrected THERE, so a fresh typo fix picked up
// automatically without needing to rescan or check history on that other
// course first. Best-effort only: short timeout, never blocks or delays the
// check-in itself, and never overwrites something the student already typed.
function refreshSuggestionFromPreviousCourse(suggestion){
  const prevCourseId=getActiveCourseId();
  if(!prevCourseId||!suggestion)return;
  const prevUrl=getScriptURL(prevCourseId);
  if(!prevUrl)return;
  const cbName='_pc'+Date.now();
  const script=document.createElement('script');
  const timer=setTimeout(()=>{delete window[cbName];script.remove();},3000);
  window[cbName]=function(data){
    clearTimeout(timer);delete window[cbName];script.remove();
    if(!data||data.status!=='ok')return;
    const resolved=data.resolvedName;
    if(!resolved||resolved===suggestion)return;
    setLastUsedName(resolved);
    // Only overwrite the visible input if the student hasn't already edited it
    const input=document.getElementById('student-name');
    if(input&&input.value.trim()===suggestion){
      input.value=resolved;
      onNameInput();
    }
  };
  script.onerror=function(){clearTimeout(timer);delete window[cbName];script.remove();};
  script.src=buildStudentURL(prevUrl,{action:'get_student_records',name:suggestion},getSecretKey(prevCourseId))+'&callback='+cbName;
  document.head.appendChild(script);
}

function showCheckinButton(token){
  const courseId=token.scriptUrl;
  const isLocked=courseId?!!getLockedName(courseId):false;
  const name=getCurrentName(courseId);
  const btn=document.getElementById('auto-checkin-btn');
  const sub=document.getElementById('checkin-btn-sub');
  const SESSIONS=sessionsFromToken(token);const HOURS=hoursFromToken(token);
  const sessLabel=SESSIONS[token.session]?.date?fmtDate(SESSIONS[token.session].date):'Day '+(token.session+1);
  const hourLabel=HOURS[token.hour]?.time||('Hour '+(token.hour+1));

  if(!name){
    // 이름 없음 — 입력 안내 메시지 표시, 버튼은 onNameInput()이 처리
    const prefix=token.testMode?'🧪 테스트 모드 — ':'';
    showAutoResult('warn','✏️',prefix+'위에 이름을 입력한 후 나타나는 버튼을 눌러 체크인하세요.');
    if(sub)sub.textContent=(token.testMode?'🧪 테스트 모드 · ':'')+'이름 입력 후 탭하세요';
    // 버튼 숨김 — onNameInput이 이름 타이핑 시 표시함
    btn.style.display='none';
    return;
  }

  if(!isLocked) refreshSuggestionFromPreviousCourse(name);

  if(sub)sub.textContent=(token.testMode?'🧪 테스트 모드 · ':'')+sessLabel+' · '+hourLabel;
  btn.style.display='block';
  btn.onclick=()=>{
    btn.style.display='none';
    processCheckIn(JSON.stringify(token));
  };

  // Already locked for this course → name is guaranteed correct, safe to
  // check in automatically. A brand-new course (or a test-mode scan, which
  // is never locked and never persisted) shows a pre-filled suggestion the
  // student may want to correct, so it waits for an explicit tap instead of
  // firing on its own.
  if(isLocked&&!token.testMode){
    setTimeout(()=>{
      btn.style.display='none';
      processCheckIn(JSON.stringify(token));
    }, 300);
  }
}

window.addEventListener('storage',e=>{
  if(e.key==='att_courses')renderHistory();
  if(e.key==='att_active_course')renderCourseBanner();
});
</script>
</body>
</html>
